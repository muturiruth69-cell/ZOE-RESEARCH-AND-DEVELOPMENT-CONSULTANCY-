<svg class="viz__svg" viewBox="0 0 520 440" role="img" aria-label="Workflow: frame the question, collect data, analyse, decide">
  <rect class="vz-card" x="1" y="1" width="518" height="438" rx="10"/>
  <text class="vz-m" x="32" y="46" font-size="13" letter-spacing="1.5">HOW EVIDENCE BECOMES A DECISION</text>
  <path class="vz-ln-au" d="M62 104V368" stroke-width="3" stroke-dasharray="6 8"/>
  <g transform="translate(32 76)">
    <rect class="vz-soft" width="456" height="58" rx="6"/><circle class="vz-g7" cx="30" cy="29" r="18"/><text x="30" y="34" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
    <text class="vz-t" x="62" y="26" font-size="16">Frame the question</text><text class="vz-m" x="62" y="45" font-size="12">What decision must the work answer?</text>
    <circle class="vz-au" cx="420" cy="29" r="16"/><text x="420" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#10263A">?</text>
  </g>
  <g transform="translate(32 164)">
    <rect class="vz-soft" width="456" height="58" rx="6"/><circle class="vz-g7" cx="30" cy="29" r="18"/><text x="30" y="34" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
    <text class="vz-t" x="62" y="26" font-size="16">Collect the data</text><text class="vz-m" x="62" y="45" font-size="12">Surveys, interviews, records</text>
    <rect class="vz-g3" x="372" y="30" width="12" height="16" rx="2"/><rect class="vz-g" x="390" y="20" width="12" height="26" rx="2"/><rect class="vz-g7" x="408" y="12" width="12" height="34" rx="2"/><rect class="vz-au" x="426" y="24" width="12" height="22" rx="2"/>
  </g>
  <g transform="translate(32 252)">
    <rect class="vz-soft" width="456" height="58" rx="6"/><circle class="vz-g7" cx="30" cy="29" r="18"/><text x="30" y="34" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
    <text class="vz-t" x="62" y="26" font-size="16">Analyse and test</text><text class="vz-m" x="62" y="45" font-size="12">Clean, model, check findings with you</text>
    <path class="vz-ln-g" d="M368 44 384 34 400 38 416 22 438 14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="vz-au" cx="438" cy="14" r="5"/>
  </g>
  <g transform="translate(32 340)">
    <rect class="vz-gradbox" width="456" height="66" rx="6"/><circle class="vz-au" cx="30" cy="33" r="18"/><text x="30" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#10263A">4</text>
    <text x="62" y="30" font-size="16" font-weight="700" fill="#fff">Decide and act</text><text x="62" y="50" font-size="12" fill="rgba(255,255,255,.85)">A clear recommendation, signed by a named lead</text>
    <circle cx="420" cy="33" r="17" fill="#fff"/><path d="M412 33l6 6 11-12" fill="none" stroke="#10263A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

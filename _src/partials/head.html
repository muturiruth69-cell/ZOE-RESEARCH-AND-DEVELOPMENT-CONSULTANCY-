<script>
  /* Colour mode before first paint: link override, saved choice, else light */
  (function (d) {
    d.classList.add('js');
    var t = null;
    try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('zoe-theme'); } catch (e) {}
    if (true) {
      t = 'light';
    }
    d.setAttribute('data-theme', t);
    var signedIn = false;
    try { signedIn = !!localStorage.getItem('zoe-session'); } catch (e) {}
    if (!signedIn) {
      d.classList.add('gated');
      /* Only the landing (home) page is public: send visitors there to log in */
      if (!/(^|\/)(index\.html)?$/.test(location.pathname)) { location.replace('index.html?login=1'); }
    }
  })(document.documentElement);
</script>
